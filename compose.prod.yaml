# Bentuk produksi. `compose.yaml` yang sebelah tetap untuk pengembangan — nilai-nilai lokalnya
# (Mailpit, TRUST_PROXY 0, bind ke 127.0.0.1) memang berguna di sana dan tidak boleh ikut ke sini.
#
# Perintah:
#   docker compose -f compose.prod.yaml build           # verifikasi lokal
#   docker compose -f compose.prod.yaml pull            # di server, image dari GHCR
#   docker compose -f compose.prod.yaml run --rm migrate
#   docker compose -f compose.prod.yaml up -d

x-app: &app
  image: ${ARUNA_IMAGE:-ghcr.io/haryosmd/aruna-dewa-web-app:latest}
  restart: unless-stopped
  # Tanpa batas ini, satu container yang restart-loop memenuhi disk dan mematikan Postgres —
  # kegagalan yang tidak pulih sendiri dan tidak terlihat sampai semuanya sudah mati.
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aruna
      POSTGRES_USER: aruna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib disetel di .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aruna -d aruna']
      interval: 5s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # Sekali jalan lalu keluar. Seed ikut di sini dan memang wajib: tabel katalog diisi darinya,
  # dan tanpa itu halaman /order tidak punya apa pun untuk dijual. Isinya upsert idempoten.
  migrate:
    <<: *app
    restart: 'no'
    command: ['sh', '-c', 'pnpm db:deploy && pnpm db:seed']
    env_file: ./api.env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['pnpm', '--filter', '@aruna/api', 'start']
    env_file: ./api.env
    # `environment:` menang atas `env_file:`, dan di sini itu memang yang diinginkan. Ketiga nilai
    # berikut menentukan apakah container bisa dihubungi dan apakah unggahan bertahan, jadi
    # tempatnya di berkas yang ikut git — bukan di `api.env` yang hanya ada di satu server dan
    # ditulis tangan sekali.
    environment:
      # Bawaan `main.ts` adalah 127.0.0.1. Di dalam container itu loopback milik container ini
      # sendiri, jadi Caddy — container lain — tidak akan pernah tersambung. Gejalanya 502 dari
      # proxy, bukan galat saat boot: lognya bersih dan situsnya mati.
      HOST: 0.0.0.0
      PORT: '3001'
      # Wajib absolut. Nilai relatif diselesaikan terhadap cwd proses, dan
      # `pnpm --filter @aruna/api start` berjalan dari /app/apps/api — di luar volume di bawah,
      # di lapisan container yang dibuang setiap rilis.
      MEDIA_LOCAL_DIR: /app/.data/media
      # Di mana foto pelanggan disimpan. Tempatnya di sini dengan alasan yang sama seperti dua
      # nilai di atas: ia menentukan apakah unggahan bertahan, jadi ia tidak boleh hidup hanya di
      # `api.env` yang ada di satu server dan ditulis tangan sekali. Rahasianya (`S3_*`) tetap di
      # sana — yang ikut git adalah keputusannya, bukan kuncinya.
      #
      # Rollback ke `local` aman **selama** `ops/media-migrate.sh --flip` belum dijalankan: baris
      # yang masih `LOCAL` tetap dibaca dari volume di bawah, dan `storageForAsset()` memilih per
      # aset, bukan per proses.
      MEDIA_PROVIDER: s3
      # Induk bersama `arunadewa.id` dan `api.arunadewa.id`. Tanpa ini cookie sesi terbit
      # host-only di host API, dan render server Nuxt — yang membacanya dari header cookie yang
      # sampai ke host WEB — tidak pernah melihatnya: tiap navigasi penuh ke halaman ber-middleware
      # `auth` memantul ke /login dengan sesi yang sebenarnya hidup. Di mesin pengembang kedua
      # host sama, jadi kelas kegagalan ini tidak bisa muncul di sana. `common/cookie-domain.ts`
      # menolak boot kalau nilainya hilang atau bukan induk kedua host.
      COOKIE_DOMAIN: arunadewa.id
    expose:
      - '3001'
    # Sejak fase 56 ini bukan lagi jalur tulis — unggahan baru mendarat di bucket. Ia tetap
    # dipasang karena ia satu-satunya sumber baca aset warisan `provider = LOCAL`, dan mencabutnya
    # sekarang berarti undangan yang sudah disebar kehilangan fotonya. Dihapus di fase tersendiri,
    # setelah `--flip` dan setelah `SELECT count(*) FROM "MediaAsset" WHERE provider='LOCAL'` nol.
    volumes:
      - media:/app/.data/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:3001/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    <<: *app
    command: ['node', 'apps/web/.output/server/index.mjs']
    env_file: ./web.env
    environment:
      # Nitro memang bind ke semua antarmuka secara bawaan, tapi satu `HOST` di `web.env` bisa
      # membalikkannya tanpa jejak. Ditulis di sini supaya Caddy selalu punya alamat untuk dituju.
      HOST: 0.0.0.0
      PORT: '3000'
      # Ketiganya punya nilai cadangan loopback di nuxt.config.ts, dan itulah bahayanya: tanpa
      # disetel, situsnya menyala dan terlihat benar sampai seseorang memakainya.
      #   - NUXT_PUBLIC_WEB_BASE membangun tautan undangan di composables/useGuestLink.ts. Salah
      #     setel berarti pelanggan membagikan http://127.0.0.1:3000/i/... ke tamu pernikahannya.
      #     Ia juga jadi header `origin` pada render server (composables/useApi.ts:62), dan
      #     `webOrigins()` di API hanya menerima WEB_ORIGIN — jadi tiap halaman dasbor yang
      #     dirender server dijawab 403. Plus canonical, sitemap.xml, dan robots.txt.
      #   - NUXT_API_BASE dipakai dari dalam jaringan compose; lewat nama service, bukan lewat
      #     Caddy, supaya render server tidak keluar-masuk TLS untuk memanggil tetangganya.
      #   - NUXT_PUBLIC_API_BASE dipakai browser, jadi ia harus alamat publik.
      NUXT_API_BASE: http://api:3001/v1
      NUXT_PUBLIC_API_BASE: https://api.arunadewa.id/v1
      NUXT_PUBLIC_WEB_BASE: https://arunadewa.id
    expose:
      - '3000'
    # `service_started`, dan sengaja BUKAN `service_healthy` walaupun `api` punya healthcheck.
    # Menaikkannya mengubah kegagalan sebagian menjadi kegagalan total: sejak `/ready` ikut
    # memeriksa direktori media, volume media yang bermasalah membuat `api` unhealthy — dan
    # dengan `service_healthy` di sini, web tidak akan pernah menyala. Galeri foto yang rusak
    # berubah jadi situs yang mati. Gerbang `/ready` di deploy.yml sudah membuatnya berisik;
    # itu tempat yang benar untuk menghentikan rilis, bukan di sini.
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # Nitro tidak punya endpoint kesehatan sendiri; halaman depan dirender penuh dan itu
      # justru bukti yang lebih kuat daripada rute khusus yang bisa hijau saat render rusak.
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:3000/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ['pnpm', '--filter', '@aruna/worker', 'start']
    env_file: ./worker.env
    # Hanya untuk healthcheck dan container tetangga; tidak diterbitkan ke luar.
    expose:
      - '3002'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Worker adalah satu-satunya service yang bisa "hidup tapi mati": `boss.on('error')` hanya
    # mencetak galat, prosesnya tidak pernah keluar, dan `restart: unless-stopped` karena itu
    # tidak pernah menolong. Antreannya menumpuk tanpa gejala. Endpoint ini menjawab pertanyaan
    # yang sebelumnya tidak bisa ditanyakan siapa pun: apakah ia masih benar-benar bekerja?
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:3002/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Satu-satunya service yang menerbitkan port. 80 dan 443 terbuka ke dunia, dan 80 memang harus
  # begitu: tantangan ACME HTTP-01 lewat sana. Menutupnya tidak mematikan apa pun hari ini, lalu
  # mematikan situs dua bulan kemudian saat perpanjangan sertifikat gagal.
  #
  # Tidak ada CDN di depan, jadi TRUST_PROXY=1 di api.env benar — Caddy satu-satunya hop. Yang
  # membuatnya aman bukan firewall melainkan `trusted_proxies` Caddy yang kosong, yang membuang
  # X-Forwarded-For kiriman klien. Baca komentar X-Forwarded-For di Caddyfile sebelum mengubah
  # salah satu dari keduanya.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Urutan menyala saja, TANPA `condition: service_healthy`, dan ini keputusan sadar yang
    # membalik rencana awal. Caddy yang menunggu web sehat berarti web yang rusak menahan Caddy
    # tetap mati — dan bersamanya tantangan ACME. Pemadaman aplikasi yang bisa dipulihkan
    # berubah menjadi sertifikat kedaluwarsa, yang tidak bisa. Caddy juga melayani `api`, jadi
    # menyandera keduanya pada kesehatan web memperluas radius kegagalan, bukan mengecilkannya.
    # Harganya: beberapa detik 502 saat cold start. Itu harga yang jauh lebih murah.
    depends_on:
      - web
      - api
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  postgres:
  media:
  caddy-data:
  caddy-config:
