name: Deploy

# Hanya setelah Verify hijau. `workflow_run` dipakai, bukan `needs:`, supaya gerbang PR dan
# jalur rilis tetap dua berkas yang bisa dibaca sendiri-sendiri.
on:
  workflow_run:
    workflows: ['Verify']
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dibangun di sini, bukan di VPS: server minimum 2 vCPU / 4 GB tidak punya ruang untuk
      # `nuxt build` dengan `typeCheck` menyala, dan build yang gagal di server berarti server
      # yang sibuk, bukan pipeline yang merah.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Caddyfile hidup di /srv/aruna sebagai bind mount dan dikecualikan dari image
      # (.dockerignore:24), jadi sampai sekarang tidak ada satu pun jalur yang membawanya ke
      # server: setiap perubahan pada berkas itu diam-diam tidak pernah berlaku. Dikirim ke
      # staging dulu — divalidasi di langkah berikutnya sebelum menimpa yang sedang dipakai.
      - name: Kirim Caddyfile ke staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: Caddyfile
          target: /srv/aruna/.staging

      - name: Terapkan di server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_REF
          # `sh`, bukan bash: ssh-action menjalankan skripnya lewat shell login bawaan server,
          # dan di Ubuntu itu dash. `pipefail` tidak ada di sana — `set -euo pipefail` mati di
          # baris pertama dengan "Illegal option", sebelum satu perintah pun jalan.
          # `script_stop` juga dilepas: bukan lagi input yang sah di v1, jadi selama ini hanya
          # jadi anotasi peringatan. `set -e` yang menghentikan di kegagalan pertama.
          script: |
            set -eu
            cd /srv/aruna

            # Kegagalan scp yang diam lebih buruk daripada deploy yang merah: Caddyfile lama
            # tetap dipakai dan perubahannya hilang tanpa jejak, persis bug yang baru ditutup.
            test -f .staging/Caddyfile || { echo "::error::Caddyfile tidak sampai ke staging."; exit 1; }

            # Validasi SEBELUM menimpa. Caddyfile rusak yang sudah mendarat di tempatnya tidak
            # menjatuhkan Caddy yang sedang jalan — ia mematikan situs pada restart berikutnya,
            # jauh dari rilis yang menyebabkannya. Container sekali pakai supaya validasi tetap
            # mungkin walau caddy sedang mati.
            docker run --rm -v /srv/aruna/.staging/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            mv .staging/Caddyfile Caddyfile

            # Tag yang sedang jalan disalin apa adanya sebelum ditimpa. Membacanya lewat
            # `compose config --images` akan salah: yang keluar pertama belum tentu image
            # aplikasi, bisa saja postgres atau caddy.
            cp .image.env .image.env.previous 2>/dev/null || true
            echo "ARUNA_IMAGE=$IMAGE_REF" > .image.env

            compose="docker compose -f compose.prod.yaml --env-file .env --env-file .image.env"
            $compose pull
            # Migrasi tidak dijalankan terpisah di sini: `api` dan `worker` sudah menunggu
            # `service_completed_successfully` dari service `migrate`, jadi `up -d` yang
            # mengurutkannya. Menjalankannya dua kali aman (idempoten) tapi menyesatkan saat
            # membaca log kegagalan.
            $compose up -d

            # Caddy membaca Caddyfile lewat bind mount, jadi `up -d` tidak melihat perubahannya.
            # `reload` menukar konfigurasi tanpa memutus koneksi; `--force-recreate` akan memutus
            # trafik di tiap rilis walaupun Caddyfile-nya tidak berubah sama sekali.
            # Berulang karena `up -d` kembali saat container baru dijadwalkan, belum tentu siap.
            reloaded=0
            n=1
            while [ $n -le 5 ]; do
              if $compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                reloaded=1
                break
              fi
              n=$((n + 1))
              sleep 3
            done
            [ "$reloaded" = 1 ] || { echo "::error::Caddy menolak memuat ulang konfigurasi."; exit 1; }
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}

      # Gerbangnya di sini, dan ia sengaja gagal dengan berisik. Rollback dilakukan sadar dengan
      # satu perintah (lihat di bawah), bukan otomatis — lihat "Yang ditunda" di rencana.
      - name: Tunggu /ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 5 "https://api.arunadewa.id/ready" > /dev/null; then
              echo "Siap setelah $((attempt * 5)) detik."
              exit 0
            fi
            sleep 5
          done
          echo "::error::/ready tidak pernah membalas 200 dalam 90 detik."
          echo "Rollback:"
          echo "  ssh aruna sudo /usr/local/lib/aruna/rollback.sh"
          echo "Ia menukar .image.env dengan yang sebelumnya, menarik image lama, dan menunggu"
          echo "/ready dari dalam container — bukan lewat Caddy, yang menjawab 308 dan membuat"
          echo "pemeriksaan lulus walau API mati."
          echo "Aman selama migrasi rilis ini aditif; migrasi Prisma maju-saja. Kalau rilis ini"
          echo "menghapus atau mengubah kolom, yang kamu butuhkan restore — ops/backup/README.md."
          exit 1

      # Setelah gerbang /ready, bukan di dalam langkah "Terapkan di server". `up -d` kembali saat
      # container dijadwalkan, belum tentu sehat — memangkas di baris berikutnya berarti menghapus
      # image yang kamu butuhkan untuk rollback justru ketika boot-nya gagal. Langkah terpisah di
      # sini hanya berjalan kalau rilisnya terbukti hidup.
      - name: Pangkas image lama di server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # `sh`, bukan bash — alasan yang sama dengan langkah terapkan di atas.
          script: |
            set -eu
            cd /srv/aruna

            # Tiga yang disimpan, masing-masing dengan alasannya:
            #   current  — sedang dipakai
            #   previous — jalur rollback, dan tidak dipakai container mana pun sehingga
            #              `docker rmi` tidak akan menolaknya
            #   :latest  — ditunjuk compose.prod.yaml sebagai bawaan ${ARUNA_IMAGE:-...}
            current=$(sed -n 's/^ARUNA_IMAGE=//p' .image.env)
            previous=$(sed -n 's/^ARUNA_IMAGE=//p' .image.env.previous 2>/dev/null || true)
            repo=${current%:*}

            # --filter reference: postgres:17-alpine dan caddy:2-alpine tidak pernah jadi kandidat.
            # grep -v -x: tanpa -x, sha "abc123" ikut menyaring "abc1234" dan yang tersisa adalah
            # image yang kamu kira sudah terhapus.
            # xargs -r: tanpa argumen, `docker rmi` keluar dengan galat dan `set -e` mematikan
            # langkah ini — kegagalan palsu yang persis terjadi di rilis pertama setelah dipasang.
            docker images --format '{{.Repository}}:{{.Tag}}' --filter "reference=$repo" \
              | grep -v -x -e "$current" -e "${previous:-__tidak_ada__}" -e "$repo:latest" \
              | xargs -r -n1 docker rmi 2>/dev/null || true

            # Tanpa -a. `prune -af` menghapus setiap image yang tidak dipakai container yang
            # sedang jalan — termasuk jalur rollback, dan postgres/caddy yang kebetulan berhenti.
            docker image prune -f

            # `docker volume prune` TIDAK BOLEH ada di berkas ini, sekarang maupun nanti. Volume
            # `postgres` dan `media` adalah data pelanggan, dan keduanya tampak "tidak terpakai"
            # bagi Docker setiap kali stack-nya sedang turun.

            # Bukan hiasan: satu-satunya cara tahu pemangkasan ini masih cukup adalah melihat
            # angkanya di log tiap rilis.
            df -h /

      # Penyimpanan paket privat gratis GitHub 500 MB; tanpa ini kuotanya habis diam-diam.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: false
