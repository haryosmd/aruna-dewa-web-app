name: Verify
# `on: [push, pull_request]` dulu menjalankan workflow ini DUA KALI untuk tiap push ke branch
# yang punya PR terbuka, dan `concurrency` tidak menolongnya: grup untuk event push adalah
# `verify-refs/heads/<branch>` sedangkan untuk event pull_request adalah `verify-<nomor>`, jadi
# keduanya tidak pernah saling membatalkan. Terukur di run 35373368739 dan 35373374073 — dua
# Verify penuh, berjarak 3 detik, ~14 menit masing-masing.
#
# `push` sekarang dibatasi ke main, yang memang satu-satunya branch yang memicu rilis. Branch
# kerja diverifikasi lewat event pull_request-nya. Konsekuensinya disebut terang-terangan:
# push ke branch yang BELUM punya PR tidak menjalankan apa pun. Bukalah PR-nya sebagai draft
# kalau butuh CI lebih awal.
on:
  push:
    branches: [main]
  pull_request:

# Tetap dikelompokkan supaya push berikutnya membatalkan yang sedang jalan, bukan mengantre di
# belakangnya. Aman terhadap deploy.yml: run yang dibatalkan berakhir `cancelled`, bukan
# `success`, jadi commit yang sudah tersalip memang tidak dirilis.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aruna
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aruna_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://aruna:ci-only@127.0.0.1:5432/aruna_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Caddyfile dan compose.prod.yaml sampai sekarang tidak diuji apa pun, padahal keduanya
      # menentukan apakah situsnya bisa dihubungi. Keduanya juga gagal dengan cara yang paling
      # tidak enak: bukan saat di-merge, tapi saat container berikutnya restart.
      #
      # Pemeriksaan ini murah (~15 detik) dan menangkap yang nyata. Dua contoh dari repo ini:
      # `reverse_prox` salah ketik, dan `tls` diletakkan di dalam `handle {}` — yang ditolak
      # Caddy dengan "directive 'tls' is not an ordered HTTP handler". Bentuk kedua itu persis
      # yang pernah ditinggalkan sebagai komentar di Caddyfile, menunggu seseorang melepasnya.
      - name: Validasi berkas infrastruktur
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -f compose.yaml config -q

          # `api.env`, `web.env`, dan `worker.env` hanya ada di /srv/aruna, mode 600, dan memang
          # tidak boleh ikut git. Tanpa ketiganya `config` berhenti di "env file not found" sebelum
          # sempat membaca satu baris pun YAML — langkah ini merah karena berkas yang absennya
          # disengaja, bukan karena ada yang salah.
          #
          # Yang diperiksa di sini adalah bentuk compose-nya, bukan isi rahasianya, jadi berkas
          # kosong sudah cukup. `required: false` di compose.prod.yaml akan lebih ringkas dan justru
          # itu bahayanya: ia ikut berlaku di produksi, dan api.env yang hilang akan menyalakan
          # container tanpa satu pun konfigurasi alih-alih menolak menyala.
          touch api.env web.env worker.env
          docker compose -f compose.prod.yaml config -q
          rm -f api.env web.env worker.env

  # Sejajar dengan `verify`, dan sengaja TANPA `needs:`, `if:`, maupun `continue-on-error:`.
  # Ketiganya adalah cara job merah tetap menghasilkan `workflow_run.conclusion: success` — dan
  # deploy.yml digerbangi tepat oleh nilai itu. Sebelum ini, 148 eksekusi Playwright tidak pernah
  # jalan di CI sama sekali: investasi terbesar repo ini tidak menjaga jalur rilisnya.
  # Dipecah per project, dan alasannya bukan sekadar "biar paralel".
  #
  # `playwright.config.ts` memaku `workers: 1`, dan itu MENAHAN BEBAN: seluruh 56 tes berbagi
  # satu akun QA dan satu undangan dari `.data/qa-account.json` yang ditulis sekali oleh
  # scripts/api-smoke.ts. Banyak di antaranya menulis ke state yang sama — simpan preferensi,
  # unggah lalu hapus media, terbitkan versi. Menaikkan `workers` akan membuat tes saling
  # menimpa, dan gejalanya adalah kegagalan yang berpindah-pindah.
  #
  # Yang dipakai di sini bukan `workers`, melainkan JOB terpisah: tiap project dapat runner
  # sendiri, service Postgres sendiri, dan karena itu fixture QA-nya sendiri. Isolasinya datang
  # dari database yang memang terpisah, bukan dari janji bahwa tesnya rukun. `workers: 1` tetap
  # berlaku di dalam tiap job, dan tidak ada satu baris tes pun yang berubah.
  #
  # Terukur: 12 menit 08 detik berurutan (run 35374936253) menjadi ~3 menit.
  e2e:
    runs-on: ubuntu-latest
    # Bukan 360 menit bawaan: suite yang menggantung tidak boleh membakar enam jam runner.
    timeout-minutes: 30
    strategy:
      # Satu project merah tidak boleh membatalkan tiga yang lain: yang paling ingin kamu baca
      # justru apakah kegagalannya khas satu lebar layar atau merata di semuanya.
      fail-fast: false
      matrix:
        include:
          - project: mobile
            browser: chromium
          - project: tablet
            browser: chromium
          - project: desktop
            browser: chromium
          - project: safari
            browser: webkit
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aruna
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: aruna_e2e
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://aruna:ci-only@127.0.0.1:5432/aruna_e2e
      # NODE_ENV sengaja TIDAK disetel. `production` menyalakan `secure: true` pada cookie sesi
      # (identity/auth.service.ts), CI berbicara http, browser membuang cookie-nya diam-diam, dan
      # setiap tes dasbor gagal 401 tanpa satu pun galat yang menyebut kata cookie.
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      WEB_ORIGIN: http://127.0.0.1:3000
      API_ORIGIN: http://127.0.0.1:3001
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      MEDIA_PROVIDER: local
      NUXT_API_BASE: http://127.0.0.1:3001/v1
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:3001/v1
      # Dikirim sebagai header `origin` saat render server; kalau meleset, OriginGuard menjawab
      # 403 pada tiap halaman dasbor yang dirender server.
      NUXT_PUBLIC_WEB_BASE: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_ORIGIN: http://127.0.0.1:3001
      # Di dalam workspace, bukan ~/.cache: path yang sama persis di langkah cache dan install.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Kunci cache adalah versi Playwright yang benar-benar ter-resolve, bukan hash lockfile:
      # hash berubah tiap kali dependency apa pun bergeser dan membatalkan ~250 MB browser
      # tanpa satu pun alasan.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          # Browser ikut kunci: tiga job chromium berbagi satu cache, `safari` punya cache webkit
          # sendiri. Tanpa itu keempatnya berebut satu kunci dengan isi yang berbeda-beda.
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      # Satu browser per job, bukan dua: tiga project pertama tidak menyebut browserName
      # (bawaannya chromium) dan hanya `safari` yang webkit. Firefox tidak pernah dipakai.
      # Dua langkah, bukan satu: `--with-deps` mengunduh browser DAN memasang pustaka sistem,
      # tapi yang di-cache hanya yang pertama. Melewatinya saat cache hit membuat WebKit gagal
      # menyala dengan galat pustaka bersama yang tidak menyebut sebabnya.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - run: pnpm db:generate
      - run: pnpm db:deploy
      # Wajib, bukan opsional: payments/orders.service.ts membaca katalog dari database, bukan
      # dari @aruna/contracts. Tanpa seed, api-smoke gagal di pemeriksaan harga.
      - run: pnpm db:seed
      - run: pnpm build

      - name: Nyalakan SMTP sink, API, dan web
        run: |
          set -euo pipefail
          # PORT disetel inline per proses, TIDAK di `env:` job: dua proses akan memperebutkan
          # satu nama variabel dan web akan bind di 3001 menimpa API. Inline juga yang paling
          # jujur dibaca — port tiap proses tertulis di baris proses itu.
          pnpm mail:local > "$RUNNER_TEMP/mail.log" 2>&1 &
          HOST=127.0.0.1 PORT=3001 pnpm --filter @aruna/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          HOST=127.0.0.1 PORT=3000 node apps/web/.output/server/index.mjs > "$RUNNER_TEMP/web.log" 2>&1 &

      - name: Tunggu ketiganya benar-benar siap
        run: |
          set -euo pipefail
          # Polling, bukan `sleep`: waktu siap bervariasi menurut beban runner, dan `sleep` yang
          # kependekan gagal sebagai "tes tidak menemukan elemen" — jauh dari penyebabnya.
          tunggu() {
            for _ in $(seq 1 60); do
              if eval "$2" >/dev/null 2>&1; then echo "$1 siap."; return 0; fi
              sleep 1
            done
            echo "::error::$1 tidak pernah siap dalam 60 detik."
            return 1
          }
          tunggu "SMTP 1025" 'node -e "require(\"node:net\").connect(1025,\"127.0.0.1\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))"'
          # /ready, bukan /health: yang kedua tidak menyentuh apa pun. Kontrak yang sama dengan
          # healthcheck compose.prod.yaml dan gerbang deploy.yml.
          tunggu "API /ready" 'curl -fsS --max-time 3 http://127.0.0.1:3001/ready'
          tunggu "Web /" 'curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:3000/'

      - run: pnpm test:integration

      # Menangkap `test:integration` yang keluar 0 tanpa menulis fixture. Murah, dan pesan
      # gagalnya langsung menunjuk sebabnya alih-alih 44 eksekusi yang hilang diam-diam.
      - name: Fixture QA benar-benar ada
        run: test -s .data/qa-account.json

      - name: Playwright
        run: pnpm exec playwright test --project=${{ matrix.project }} --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/pw.json

      # Exit code saja tidak cukup: `test.skip` menandai eksekusi sebagai skipped, bukan failed,
      # dan Playwright tetap keluar 0. Angka 152 sengaja dipaku dan sengaja rapuh — menambah tes
      # berarti mengubahnya dengan sadar, dan itulah momen seseorang harus memutuskan apakah tes
      # barunya ikut menjaga jalur rilis.
      #
      # 148 -> 152 di Fase 25: satu tes baru, "only the hero image is on the landing critical
      # path", dikali empat project. Ia memang harus ikut menjaga jalur rilis — yang dikuncinya
      # adalah atribut yang tidak punya gejala visual sama sekali (`loading`, `fetchpriority`,
      # dan `rel=preload` yang menunjuk berkas yang sama), jadi regresinya hanya akan terlihat
      # sebagai halaman yang pelan, bukan sebagai halaman yang rusak.
      #
      # 152 -> 156 di Fase 26: satu tes baru, "account menu carries the way out of the account",
      # dikali empat project. Ia memang harus ikut menjaga jalur rilis: yang dikuncinya adalah
      # apakah orang punya jalan keluar dari akunnya sendiri. Logout sudah bekerja berbulan-bulan
      # sementara satu-satunya tombolnya bersembunyi di layar yang harus dibuka lebih dulu, dan
      # selama itu tidak ada satu pun tes yang bisa membedakannya dari fitur yang belum dibuat.
      # Sapuan axe dasbor ikut bertambah satu halaman (`/account`) tanpa menambah eksekusi:
      # halamannya masuk ke daftar di dalam tes yang sudah ada.
      # 156 -> 172 di Fase 61: empat tes baru dikali empat project, semuanya lahir di fase 59-60
      # dan baru sekarang diikutkan gerbang. Angkanya dinaikkan **setelah** sebab satu-satunya
      # skip dihapus, bukan sebelumnya: `mengunci pemilih saat add-on desain belum dibeli` dulu
      # melewati dirinya sendiri kalau `#ornament-locked` tidak ada, dan karena pemilik fixture QA
      # selalu dinaikkan jadi `OPERATOR` (supaya bisa mengaktifkan tanpa bayar), `canEditDesign()`
      # selalu benar dan keadaan terkunci tidak pernah bisa terjadi. Tes itu lulus di keempat
      # project tanpa sekali pun berjalan. `api-smoke.ts` sekarang menyeed undangan kedua milik
      # akun biasa, jadi keadaannya nyata dan tesnya benar-benar menguji sesuatu — dibuktikan
      # merah saat diarahkan ke undangan operator. Menaikkan angkanya lebih dulu akan membuat
      # gerbang ini hijau justru dengan menyembunyikan tes yang tidak pernah jalan.
      #
      # Sejak suite dipecah per project, angka 172 tidak bisa lagi diperiksa di sini: job ini cuma
      # melihat seperempatnya. Yang tinggal di sini adalah yang memang lokal — skip dan flaky —
      # dan angka totalnya dijumlahkan di job `e2e-gate` di bawah. Memecahnya begini disengaja:
      # kalau `expected` diperiksa per project, menambah satu tes berarti mengarang empat angka
      # baru alih-alih satu.
      - name: Tidak boleh ada yang skip
        run: |
          node -e '
            const { expected, skipped, unexpected, flaky } = require(process.env.REPORT).stats;
            console.log({ project: process.env.PROJECT, expected, skipped, unexpected, flaky });
            if (skipped) { console.error(`::error::${skipped} eksekusi di-skip; gerbang e2e hanya berguna kalau semuanya jalan.`); process.exit(1); }
            if (flaky) { console.error(`::error::${flaky} eksekusi lulus hanya setelah diulang; itu bukan hijau.`); process.exit(1); }
          '
        env:
          REPORT: ${{ runner.temp }}/pw.json
          PROJECT: ${{ matrix.project }}

      # `if: always()` dan BUKAN hanya saat sukses: `e2e-gate` harus bisa membedakan "project ini
      # menghasilkan 40 lulus" dari "project ini tidak pernah melapor". Tanpa berkasnya, yang
      # kedua menyamar jadi yang pertama.
      - name: Angka project ini
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-stats-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pw.json
          retention-days: 7
          if-no-files-found: error

      # run_attempt di nama artifact: tanpa itu "Re-run failed jobs" gagal dengan konflik nama,
      # dan laporannya hilang justru pada percobaan yang paling ingin kamu baca.
      - name: Laporan Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ github.run_attempt }}
          # Keduanya perlu: playwright-report/ adalah HTML-nya, test-results/ memuat trace dan
          # screenshot yang ditautkannya lewat path relatif.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

      # Saat tes dasbor gagal 401, jawabannya hampir selalu ada di api.log, bukan di trace browser.
      - name: Log server
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.project }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: warn

      # `docs/` ada di .gitignore, jadi tanpa langkah ini bukti visual dari empat viewport —
      # termasuk WebKit 390px, satu-satunya bukti tampilan di iOS — menguap bersama runner.
      - name: Bukti verifikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.project }}-${{ github.run_attempt }}
          path: docs/features/**/verification/
          retention-days: 7
          if-no-files-found: ignore

  # Angka 172 hidup di sini sekarang, satu tempat, dijumlahkan dari keempat project.
  #
  # Exit code keempat job e2e saja tidak cukup, dan itu sebabnya job ini ada: `test.skip`
  # menandai eksekusi sebagai skipped, bukan failed, dan Playwright tetap keluar 0. Angkanya
  # sengaja dipaku dan sengaja rapuh — menambah tes berarti mengubahnya dengan sadar, dan itulah
  # momen seseorang harus memutuskan apakah tes barunya ikut menjaga jalur rilis.
  #
  # Riwayat angkanya: 148 -> 152 (Fase 25, "only the hero image is on the landing critical path"),
  # 152 -> 156 (Fase 26, "account menu carries the way out of the account"), 156 -> 172 (Fase 61,
  # empat tes dari fase 59-60 yang baru diikutkan gerbang, setelah sebab satu-satunya skip
  # dihapus lebih dulu). Rincian alasan tiap kenaikan ada di riwayat git berkas ini.
  #
  # 172 -> 247: kerja fase 72-77 menambah tes tanpa menaikkan angkanya, dan itu tidak pernah
  # ketahuan karena Playwright selalu keluar non-zero lebih dulu sehingga langkah pemeriksa
  # angkanya tidak pernah sempat jalan. Angka barunya BUKAN 4 x jumlah tes: tiga tes bertanda
  # `@desktop` hanya berlaku di satu project (lihat playwright.config.ts), jadi susunannya
  # desktop 64 + mobile 61 + tablet 61 + safari 61. Keempatnya diukur, bukan dihitung di kepala.
  #
  # 247 -> 310 (PR #7, fase 78-82): berkas fase78-81.spec.ts masuk git untuk pertama kali, plus
  # tes baru fase 82 di fase81.spec.ts. Diukur dengan `playwright test --list` per project DAN dari
  # run CI yang hijau (0 skipped, 0 flaky): desktop 97 + mobile 71 + tablet 71 + safari 71. Desktop
  # naik lebih banyak karena seluruh fase81.spec.ts bertanda `@desktop`.
  #
  # `needs: e2e` menunggu keempat matrix job. TANPA `if: always()`: kalau ada yang merah,
  # workflow-nya sudah merah dan job ini tidak perlu menambah kebisingan.
  e2e-gate:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pw-stats-*-${{ github.run_attempt }}
          path: stats

      - name: Jumlah eksekusi keempat project
        run: |
          node -e '
            const { readdirSync, readFileSync } = require("node:fs");
            const dirs = readdirSync("stats", { withFileTypes: true }).filter((d) => d.isDirectory());
            const per = dirs.map((d) => {
              const { expected, skipped, unexpected, flaky } = JSON.parse(readFileSync(`stats/${d.name}/pw.json`, "utf8")).stats;
              return { project: d.name, expected, skipped, unexpected, flaky };
            });
            console.table(per);

            // Empat, tidak kurang: satu project yang gagal SEBELUM Playwright menulis laporannya
            // tidak meninggalkan berkas, dan jumlah dari tiga project tidak boleh pernah lolos
            // hanya karena kebetulan angkanya pas.
            if (per.length !== 4) { console.error(`::error::${per.length} project melapor, seharusnya 4. Ada job e2e yang tidak pernah sampai menulis laporannya.`); process.exit(1); }

            const total = per.reduce((n, p) => n + p.expected, 0);
            const seharusnya = 310;
            if (total !== seharusnya) { console.error(`::error::${total} lulus, seharusnya ${seharusnya}. Perbarui angkanya dengan sadar kalau memang ada tes baru.`); process.exit(1); }
            console.log(`${total} eksekusi lulus di empat project.`);
          '

  # Image dibangun DI SINI, berbarengan dengan e2e, bukan di deploy.yml setelah semuanya hijau.
  #
  # Membangun image tidak butuh tes lulus; yang butuh gerbang hijau hanyalah penerapannya ke
  # server. Selama ini keduanya disamakan, dan akibatnya 3 menit 56 detik build ditumpuk di
  # belakang 15 menit Verify secara berurutan. Sekarang keduanya jalan bersamaan dan deploy.yml
  # tinggal menarik tag-nya.
  #
  # Ya, ini berarti commit yang tesnya merah pun bisa punya image di GHCR. Itu tidak membuka
  # jalur rilis apa pun: tag-nya sha, gerbang deploy.yml tetap `workflow_run.conclusion ==
  # success`, dan tidak ada satu pun yang merujuk image itu. Tag `latest` sengaja TIDAK didorong
  # dari sini — lihat alasannya di deploy.yml.
  #
  # Job ini berjalan di PR juga, dan itu bukan pemborosan: sampai sebelum ini, Dockerfile tidak
  # pernah dibangun oleh satu pun gerbang PR — build pertamanya selalu terjadi di deploy.yml,
  # yaitu saat rilis. Dockerfile yang rusak baru ketahuan ketika ia menjatuhkan rilis, persis
  # bentuk kegagalan yang sudah ditutup untuk Caddyfile dan compose.prod.yaml di job `verify`.
  # Di PR ia dibangun tanpa didorong; hanya main yang mendorong.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Sha PENDEK, persis seperti deploy.yml menghitungnya. Keduanya harus sepakat: deploy.yml
      # mencari tag ini di GHCR dan membangun sendiri kalau tidak ketemu, jadi format yang
      # meleset tidak akan merah — ia hanya diam-diam membangun ulang tiap rilis dan menghapus
      # seluruh penghematannya.
      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Hanya di main: PR tidak mendorong apa pun, dan PR dari fork tidak punya izin
      # packages:write sehingga login-nya akan gagal sebelum sempat membangun.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dua build, dan pembagiannya adalah inti penghematannya.
      #
      # `cache-to: type=gha,mode=max` pada build penuh menghabiskan 1 menit 53 detik (run
      # 35376471340, langkah #28) untuk menyimpan 43 detik kerja — rugi bersih, dan rugi di
      # jalur kritis. Sebabnya: mode=max mengekspor SEMUA lapisan antara, termasuk lapisan stage
      # `build` yang dibatalkan `COPY . .` di tiap commit dan karena itu tidak akan pernah
      # dipakai ulang. Kita membayar untuk menyimpan sesuatu yang dijamin basi.
      #
      # Yang benar-benar layak di-cache hanyalah `prod-deps`: pnpm install, prisma generate, dan
      # prune, yang hanya berubah saat lockfile atau schema.prisma berubah. Build pertama
      # mengekspor persis itu dan tidak lebih.
      - name: Cache dependensi (pnpm install + prisma generate + prune)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod-deps
          push: false
          cache-from: type=gha,scope=prod-deps
          cache-to: type=gha,mode=max,scope=prod-deps

      # Build kedua TANPA `cache-to`. Lapisan `prod-deps` sudah ada di builder lokal dari langkah
      # di atas, jadi ia gratis di sini; sisanya tidak akan pernah dipakai ulang, jadi menyimpannya
      # hanya menambah menit tanpa menghemat apa pun nanti.
      #
      # `provenance: false`: attestation bawaan build-push-action v6 menambah manifest kedua dan
      # ikut diekspor tiap rilis. Repo ini tidak memverifikasinya di mana pun.
      - name: Bangun dan dorong image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=prod-deps
