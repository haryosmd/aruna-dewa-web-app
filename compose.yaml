services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aruna
      POSTGRES_USER: aruna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aruna-local-only}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aruna -d aruna']
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['pnpm', '--filter', '@aruna/api', 'start']
    env_file: apps/api/.env
    environment:
      # `cookieOptions()` menggantungkan `Secure` pada nilai ini: tanpa disetel, cookie sesi
      # berangkat lewat plaintext di deploy yang mengira dirinya produksi.
      NODE_ENV: production
      # API di sini dipublikasikan langsung, tanpa proxy di depan. Menyalakannya berarti
      # `X-Forwarded-For` karangan siapa pun jadi `request.ip`.
      TRUST_PROXY: '0'
      DATABASE_URL: postgresql://aruna:${POSTGRES_PASSWORD:-aruna-local-only}@postgres:5432/aruna
      SMTP_HOST: mailpit
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/apps/api/.data/media
    profiles: ['app']
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'apps/web/.output/server/index.mjs']
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_API_BASE: http://api:3001/v1
      NUXT_PUBLIC_API_BASE: http://127.0.0.1:3001/v1
    ports:
      - '127.0.0.1:3000:3000'
    profiles: ['app']
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['pnpm', '--filter', '@aruna/worker', 'start']
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:3001
      DATABASE_URL: postgresql://aruna:${POSTGRES_PASSWORD:-aruna-local-only}@postgres:5432/aruna
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['app']
volumes:
  postgres:
  media:
